{{#address}}
<section class="sec map-sec map-btn-sec">
  <div class="card">
    {{#venue}}<h2 class="title" data-anim="fadeinup">{{venue}}</h2>{{/venue}}
    <p class="body" data-anim="fadeinup" style="--d:.15s">{{address}}</p>
    <a class="inv-btn map-open" href="https://www.google.com/maps/search/?api=1&amp;query={{venue | url}}%20{{address | url}}" data-maps-query="{{venue}} {{address}}" target="_blank" rel="noopener noreferrer" data-anim="fadeinup" style="--d:.25s">{{#buttonLabel}}{{buttonLabel}}{{/buttonLabel}}{{^buttonLabel}}{{t.openInMaps}}{{/buttonLabel}}</a>
  </div>
</section>
{{/address}}
