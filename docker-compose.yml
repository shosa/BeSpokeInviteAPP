# Bespoke Invites: tre servizi. Il browser parla solo con "web"; "web" inoltra /api all'API; l'API parla con il database.
# Nome del progetto: dà il nome ai container (bespokeinvites-db-1, -api-1, -web-1) e alla rete.
name: bespokeinvites

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inviteme
      POSTGRES_USER: inviteme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD nel file .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inviteme -d inviteme"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://inviteme:${POSTGRES_PASSWORD}@db:5432/inviteme
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Imposta ADMIN_TOKEN nel file .env}
      # Solo al primo avvio di una nuova installazione, per avere il primo amministratore: poi si gestiscono dalla console.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ANTHROPIC_KEY: ${ANTHROPIC_KEY:-}
      # Ricerca foto Pixabay: la chiave si imposta in .env (o nell'ambiente), mai nel repository.
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      SHOPIFY_STOREFRONT_TOKEN: ${SHOPIFY_STOREFRONT_TOKEN:-}
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET:-}
      ALLOW_LOCAL_CHECKOUT: ${ALLOW_LOCAL_CHECKOUT:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
    volumes:
      - media:/app/data/media
      # Cartella dei temi del progetto: la console vi installa i temi caricati da ZIP (themes/<id>/),
      # accanto agli altri, e restano dopo ogni rilascio. Deve essere scrivibile dall'utente del container (uid 1000).
      - ./themes:/app/themes
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      # Solo loopback: ci arriva nginx dell'host (proxy_pass http://127.0.0.1:<WEB_PORT>), non Internet.
      - "127.0.0.1:${WEB_PORT:-8091}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  # I volumi tengono il nome storico (inviteme_*): sono quelli con il database e i file dei clienti.
  # Cambiarlo creerebbe volumi nuovi e vuoti.
  pgdata:
    name: inviteme_pgdata
  media:
    name: inviteme_media
