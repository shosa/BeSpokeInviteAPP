<section class="sec dress-sec profumi-sec">
  <div class="card">
    {{#heading}}<h2 class="title" data-anim="fadeinup">{{heading}}</h2>{{/heading}}
    {{#dress}}<div class="dress" data-anim="fadeinup" style="--d:.1s">{{dress}}</div>{{/dress}}
    <div class="dress-dots" data-anim="fadeinup" style="--d:.2s">{{#colors}}{{#hex}}<span class="flacone"><span class="fl-tappo"></span><span class="fl-collo"></span><span class="fl-vetro"><span class="fl-liquido" role="img" aria-label="{{name}}" style="--c:{{hex}}"></span></span>{{#name}}<span class="fl-nome">{{name}}</span>{{/name}}</span>{{/hex}}{{/colors}}</div>
  </div>
</section>
