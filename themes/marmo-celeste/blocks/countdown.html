<section class="sec countdown-sec dorsi-sec">
  <div class="card">
    <p class="ds-intro" data-anim="fadein">{{t.countdownAria}}</p>
    <div class="ds-scaffale" data-countdown="{{eventDate}}T{{eventTime}}" aria-label="{{t.countdownAria}}" data-anim="fadeinup" style="--d:.1s">
      <div class="time-block ds" data-cd-block="days"><span class="ds-nervo" aria-hidden="true"></span><div class="ds-tassello"><div class="number-wrap"><span class="number" data-cd="days">00</span></div><div class="label">{{t.days}}</div></div><span class="ds-nervo b" aria-hidden="true"></span></div>
      <div class="separator sep1" aria-hidden="true"></div>
      <div class="time-block ds" data-cd-block="hours"><span class="ds-nervo" aria-hidden="true"></span><div class="ds-tassello"><div class="number-wrap"><span class="number" data-cd="hours">00</span></div><div class="label">{{t.hours}}</div></div><span class="ds-nervo b" aria-hidden="true"></span></div>
      <div class="separator sep2" aria-hidden="true"></div>
      <div class="time-block ds" data-cd-block="minutes"><span class="ds-nervo" aria-hidden="true"></span><div class="ds-tassello"><div class="number-wrap"><span class="number" data-cd="minutes">00</span></div><div class="label">{{t.minutes}}</div></div><span class="ds-nervo b" aria-hidden="true"></span></div>
      <div class="separator sep3" aria-hidden="true"></div>
      <div class="time-block ds" data-cd-block="seconds"><span class="ds-nervo" aria-hidden="true"></span><div class="ds-tassello"><div class="number-wrap"><span class="number" data-cd="seconds">00</span></div><div class="label">{{t.seconds}}</div></div><span class="ds-nervo b" aria-hidden="true"></span></div>
    </div>
    <div class="ds-mensola" aria-hidden="true"></div>
  </div>
</section>
