<section class="sec invito-sec libro-sec">
  <div class="card">
    <div class="lb-libro" data-anim="fadeinup">
      <div class="lb-risguardo" aria-hidden="true"></div>
      <div class="lb-pagina">
        <span class="lb-segnalibro" aria-hidden="true"></span>
        {{#heading}}<h2 class="title">{{heading}}</h2>{{/heading}}
        {{#body}}<div class="after"><p class="lettera">{{body | lines}}</p></div>{{/body}}
        <div class="lb-firma">{{title}}</div>
        <div class="lb-folio" aria-hidden="true">· I ·</div>
      </div>
    </div>
  </div>
</section>
