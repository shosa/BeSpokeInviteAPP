<section class="sec dress-sec pigmenti-sec">
  <div class="card">
    {{#heading}}<h2 class="title" data-anim="fadeinup">{{heading}}</h2>{{/heading}}
    {{#dress}}<div class="dress" data-anim="fadeinup" style="--d:.15s">{{dress}}</div>{{/dress}}
    <div class="dress-dots pg-tavolozza" data-anim="fadeinup" style="--d:.2s">{{#colors}}{{#hex}}<span class="pg-vasetto"><span class="pg-colore" role="img" aria-label="{{name}}" style="background:{{hex}}"></span>{{#name}}<span class="pg-nome">{{name}}</span>{{/name}}</span>{{/hex}}{{/colors}}</div>
  </div>
</section>
