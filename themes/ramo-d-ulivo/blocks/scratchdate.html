<section class="sec date-sec corona-sec">
  <div class="card">
    <h2 class="title" data-anim="fadeinup">{{t.dateTitle}}</h2>
    <div class="corona" data-anim="zoomin" style="--d:.15s">
      <input class="cr-tg" type="checkbox" id="corona-data">
      <div class="cr-ring" aria-hidden="true">
        <span class="cr-stelo"></span>
        <span class="cr-f" style="--a:197.0deg;--t:62deg;--i:0"><i></i></span><span class="cr-f" style="--a:163.0deg;--t:-62deg;--i:0"><i></i></span><span class="cr-f" style="--a:207.5deg;--t:118deg;--i:1"><i></i></span><span class="cr-f" style="--a:152.5deg;--t:-118deg;--i:1"><i></i></span><span class="cr-f" style="--a:217.9deg;--t:62deg;--i:2"><i></i></span><span class="cr-f" style="--a:142.1deg;--t:-62deg;--i:2"><i></i></span><span class="cr-f" style="--a:228.4deg;--t:118deg;--i:3"><i></i></span><span class="cr-f" style="--a:131.6deg;--t:-118deg;--i:3"><i></i></span><span class="cr-f" style="--a:238.8deg;--t:62deg;--i:4"><i></i></span><span class="cr-f" style="--a:121.2deg;--t:-62deg;--i:4"><i></i></span><span class="cr-f" style="--a:249.3deg;--t:118deg;--i:5"><i></i></span><span class="cr-f" style="--a:110.7deg;--t:-118deg;--i:5"><i></i></span><span class="cr-f" style="--a:259.8deg;--t:62deg;--i:6"><i></i></span><span class="cr-f" style="--a:100.2deg;--t:-62deg;--i:6"><i></i></span><span class="cr-f" style="--a:270.2deg;--t:118deg;--i:7"><i></i></span><span class="cr-f" style="--a:89.8deg;--t:-118deg;--i:7"><i></i></span><span class="cr-f" style="--a:280.7deg;--t:62deg;--i:8"><i></i></span><span class="cr-f" style="--a:79.3deg;--t:-62deg;--i:8"><i></i></span><span class="cr-f" style="--a:291.2deg;--t:118deg;--i:9"><i></i></span><span class="cr-f" style="--a:68.8deg;--t:-118deg;--i:9"><i></i></span><span class="cr-f" style="--a:301.6deg;--t:62deg;--i:10"><i></i></span><span class="cr-f" style="--a:58.4deg;--t:-62deg;--i:10"><i></i></span><span class="cr-f" style="--a:312.1deg;--t:118deg;--i:11"><i></i></span><span class="cr-f" style="--a:47.9deg;--t:-118deg;--i:11"><i></i></span><span class="cr-f" style="--a:322.5deg;--t:62deg;--i:12"><i></i></span><span class="cr-f" style="--a:37.5deg;--t:-62deg;--i:12"><i></i></span><span class="cr-f" style="--a:333.0deg;--t:118deg;--i:13"><i></i></span><span class="cr-f" style="--a:27.0deg;--t:-118deg;--i:13"><i></i></span>
        <span class="cr-o" style="--a:218deg;--i:2"></span><span class="cr-o" style="--a:142deg;--i:2"></span><span class="cr-o" style="--a:248deg;--i:5"></span><span class="cr-o" style="--a:112deg;--i:5"></span><span class="cr-o" style="--a:280deg;--i:8"></span><span class="cr-o" style="--a:80deg;--i:8"></span><span class="cr-o" style="--a:312deg;--i:11"></span><span class="cr-o" style="--a:48deg;--i:11"></span>
      </div>
      <div class="cr-data">
        <span class="cr-label">{{date.long}}</span>
        <span class="cr-wd" aria-hidden="true">{{date.weekday}}</span>
        <span class="cr-day" aria-hidden="true">{{date.day}}</span>
        <span class="cr-month" aria-hidden="true">{{date.month}}</span>
        <span class="cr-year" aria-hidden="true">{{date.year}}</span>
      </div>
      <label class="cr-tap" for="corona-data"><span class="cr-sigillo" aria-hidden="true"></span><span class="cr-hint">{{t.revealAll}}</span></label>
    </div>
  </div>
</section>
