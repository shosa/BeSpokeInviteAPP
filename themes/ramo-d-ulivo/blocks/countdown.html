<section class="sec countdown-sec tempio-sec">
  <div class="card tempio">
    <div class="tp-frontone" aria-hidden="true"><span class="tp-corona"></span></div>
    <div class="tp-architrave"><span>{{t.countdownAria}}</span></div>
    <div class="tp-colonne" data-countdown="{{eventDate}}T{{eventTime}}" aria-label="{{t.countdownAria}}">
      <div class="time-block tp-col" data-cd-block="days"><span class="tp-capitello" aria-hidden="true"></span><div class="number-wrap"><span class="number" data-cd="days">00</span></div><div class="label">{{t.days}}</div></div>
      <div class="separator sep1" aria-hidden="true"></div>
      <div class="time-block tp-col" data-cd-block="hours"><span class="tp-capitello" aria-hidden="true"></span><div class="number-wrap"><span class="number" data-cd="hours">00</span></div><div class="label">{{t.hours}}</div></div>
      <div class="separator sep2" aria-hidden="true"></div>
      <div class="time-block tp-col" data-cd-block="minutes"><span class="tp-capitello" aria-hidden="true"></span><div class="number-wrap"><span class="number" data-cd="minutes">00</span></div><div class="label">{{t.minutes}}</div></div>
      <div class="separator sep3" aria-hidden="true"></div>
      <div class="time-block tp-col" data-cd-block="seconds"><span class="tp-capitello" aria-hidden="true"></span><div class="number-wrap"><span class="number" data-cd="seconds">00</span></div><div class="label">{{t.seconds}}</div></div>
    </div>
    <div class="tp-gradini" aria-hidden="true"><span></span><span></span></div>
  </div>
</section>
