<section class="sec countdown-sec timbri-sec">
  <div class="card">
    <img class="orn tb-rametto" src="assets/e-ulivo.webp" alt="" aria-hidden="true" data-anim="fadein">
    <p class="tb-intro" data-anim="fadein">{{t.countdownAria}}</p>
    <div class="tb-row" data-countdown="{{eventDate}}T{{eventTime}}" aria-label="{{t.countdownAria}}">
      <div class="time-block tb" data-cd-block="days"><div class="number-wrap"><span class="number" data-cd="days">00</span></div><div class="label">{{t.days}}</div></div>
      <div class="separator sep1" aria-hidden="true"></div>
      <div class="time-block tb" data-cd-block="hours"><div class="number-wrap"><span class="number" data-cd="hours">00</span></div><div class="label">{{t.hours}}</div></div>
      <div class="separator sep2" aria-hidden="true"></div>
      <div class="time-block tb" data-cd-block="minutes"><div class="number-wrap"><span class="number" data-cd="minutes">00</span></div><div class="label">{{t.minutes}}</div></div>
      <div class="separator sep3" aria-hidden="true"></div>
      <div class="time-block tb" data-cd-block="seconds"><div class="number-wrap"><span class="number" data-cd="seconds">00</span></div><div class="label">{{t.seconds}}</div></div>
    </div>
  </div>
</section>
