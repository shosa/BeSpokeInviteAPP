<section class="sec dress-sec rossetti-sec">
  <div class="card">
    {{#heading}}<h2 class="title" data-anim="fadeinup">{{heading}}</h2>{{/heading}}
    {{#dress}}<div class="dress" data-anim="fadeinup" style="--d:.1s">{{dress}}</div>{{/dress}}
    <div class="dress-dots" data-anim="fadeinup" style="--d:.2s">{{#colors}}{{#hex}}<span class="rossetto"><span class="rs-stick" role="img" aria-label="{{name}}" style="--c:{{hex}}"></span><span class="rs-ghiera"></span><span class="rs-tubo"></span>{{#name}}<span class="rs-nome">{{name}}</span>{{/name}}</span>{{/hex}}{{/colors}}</div>
  </div>
</section>
