{{#hasPhotos}}

    {{#heading}}<h2 class="title" data-anim="fadeinup">{{heading}}</h2>{{/heading}}
    <div class="parete" data-anim="fadein" style="--d:.1s">
      <i class="pr-nastro" aria-hidden="true"><b></b></i>
      <div class="us-grid">
        {{#photos}}<figure><img src="{{.}}" loading="lazy" decoding="async" alt=""></figure>{{/photos}}
      </div>
    </div>
  </div>
</section>
{{/hasPhotos}}
