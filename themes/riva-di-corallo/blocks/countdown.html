<section class="sec countdown-sec ciottoli-sec">
  <div class="ciottoli-in">
    <span class="ciottoli-orn" aria-hidden="true" data-anim="fadein"></span>
    <div class="ciottoli" data-countdown="{{eventDate}}T{{eventTime}}" aria-label="{{t.countdownAria}}">
      <div class="ciottolo" data-cd-block="days" data-anim="fadeinup"><div class="number-wrap"><span class="number" data-cd="days">00</span></div><div class="label">{{t.days}}</div></div>
      <div class="ciottolo" data-cd-block="hours" data-anim="fadeinup" style="--d:.12s"><div class="number-wrap"><span class="number" data-cd="hours">00</span></div><div class="label">{{t.hours}}</div></div>
      <div class="ciottolo" data-cd-block="minutes" data-anim="fadeinup" style="--d:.24s"><div class="number-wrap"><span class="number" data-cd="minutes">00</span></div><div class="label">{{t.minutes}}</div></div>
      <div class="ciottolo" data-cd-block="seconds" data-anim="fadeinup" style="--d:.36s"><div class="number-wrap"><span class="number" data-cd="seconds">00</span></div><div class="label">{{t.seconds}}</div></div>
    </div>
  </div>
</section>
