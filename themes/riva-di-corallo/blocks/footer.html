<section class="footer-sec risacca-sec">

  <span class="fl risacca-corallo r" aria-hidden="true"></span>
  <div class="footer-in">
    <span class="footer-sigillo" aria-hidden="true" data-anim="zoomin"></span>
    <h2 class="title" data-anim="fadein" style="--d:.15s">{{t.footerTitle}}</h2>
