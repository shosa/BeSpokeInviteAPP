<section class="sec countdown-sec libri-sec">
  <div class="card">
    <div class="scaffale" data-anim="fadeinup">
      <div data-countdown="{{eventDate}}T{{eventTime}}" aria-label="{{t.countdownAria}}">
        <div class="time-block" data-cd-block="days"><i class="lb-fregio" aria-hidden="true"></i><div class="number-wrap"><span class="number" data-cd="days">00</span></div><div class="label">{{t.days}}</div></div>
        <div class="separator sep1">:</div>
        <div class="time-block" data-cd-block="hours"><i class="lb-fregio" aria-hidden="true"></i><div class="number-wrap"><span class="number" data-cd="hours">00</span></div><div class="label">{{t.hours}}</div></div>
        <div class="separator sep2">:</div>
        <div class="time-block" data-cd-block="minutes"><i class="lb-fregio" aria-hidden="true"></i><div class="number-wrap"><span class="number" data-cd="minutes">00</span></div><div class="label">{{t.minutes}}</div></div>
        <div class="separator sep3">:</div>
        <div class="time-block" data-cd-block="seconds"><i class="lb-fregio" aria-hidden="true"></i><div class="number-wrap"><span class="number" data-cd="seconds">00</span></div><div class="label">{{t.seconds}}</div></div>
      </div>
      <i class="lb-fermalibri" aria-hidden="true"></i>
      <i class="lb-mensola" aria-hidden="true"></i>
    </div>
  </div>
</section>
