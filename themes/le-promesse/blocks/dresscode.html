<section class="sec dress-sec rocchetti-sec">
  <div class="card">
    {{#heading}}<h2 class="title" data-anim="fadeinup">{{heading}}</h2>{{/heading}}
    {{#dress}}<div class="dress" data-anim="fadeinup" style="--d:.1s">{{dress}}</div>{{/dress}}
    <div class="dress-dots" data-anim="fadeinup" style="--d:.2s">{{#colors}}{{#hex}}<span class="rocchetto"><span class="rc-filo" role="img" aria-label="{{name}}" style="--c:{{hex}}"></span>{{#name}}<span class="rc-nome">{{name}}</span>{{/name}}</span>{{/hex}}{{/colors}}</div>
  </div>
</section>
