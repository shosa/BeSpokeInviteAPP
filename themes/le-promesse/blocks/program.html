{{#hasItems}}
<section class="sec prog-sec segnalibro-sec">
  <div class="card">
    {{#heading}}<h2 class="title" data-anim="fadeinup">{{heading}}</h2>{{/heading}}
    <div class="segnalibro" data-anim="fadein" style="--d:.1s">
      <i class="sg-nastro" aria-hidden="true"></i>
      <div class="timeline tappe">
        {{#items}}
        <div class="t-row">
          <div class="t-dot" aria-hidden="true"></div>
          <div class="t-cell"><div class="t-time">{{time}}</div><div class="t-name">{{label}}</div></div>
        </div>
        {{/items}}
      </div>
    </div>
  </div>
</section>
{{/hasItems}}
