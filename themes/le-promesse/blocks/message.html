<section class="sec invito-sec cartella-sec">
  <div class="card">
    <div class="cartella" data-anim="fadeinup">
      <div class="biglietto">
        <i class="cr-angolo tl" aria-hidden="true"></i><i class="cr-angolo tr" aria-hidden="true"></i><i class="cr-angolo bl" aria-hidden="true"></i><i class="cr-angolo br" aria-hidden="true"></i>
        {{#heading}}<h2 class="title">{{heading}}</h2>{{/heading}}
        {{#body}}<div class="after"><p class="lettera">{{body | lines}}</p></div>{{/body}}
        <div class="cr-firma">{{title}}</div>
      </div>
    </div>
  </div>
</section>
