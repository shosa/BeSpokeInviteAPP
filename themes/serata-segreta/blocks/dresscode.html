<section class="sec dress-sec calici-sec">
  <div class="card">
    {{#heading}}<h2 class="title" data-anim="fadeinup">{{heading}}</h2>{{/heading}}
    {{#dress}}<div class="dress" data-anim="fadeinup" style="--d:.1s">{{dress}}</div>{{/dress}}
    <div class="dress-dots" data-anim="fadeinup" style="--d:.2s">{{#colors}}{{#hex}}<span class="calice"><span class="ca-coppa" role="img" aria-label="{{name}}" style="--c:{{hex}}"></span><span class="ca-stelo"></span><span class="ca-piede"></span>{{#name}}<span class="ca-nome">{{name}}</span>{{/name}}</span>{{/hex}}{{/colors}}</div>
  </div>
</section>
