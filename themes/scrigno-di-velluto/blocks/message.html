<section class="sec invito-sec coperchio-sec">
  <div class="card coperchio" data-anim="fadeinup">
    <div class="biglietto">
      <img class="bg-mughetto" src="assets/mughetto.webp" alt="" aria-hidden="true">
      {{#heading}}<h2 class="title">{{heading}}</h2>{{/heading}}
      {{#body}}<div class="after"><p class="lettera">{{body | lines}}</p></div>{{/body}}
      <span class="bg-firma" aria-hidden="true">{{monogram}}</span>
    </div>
  </div>
</section>
