{{#hasItems}}
<section class="sec prog-sec ciondoli-sec">
  <div class="card">
    {{#heading}}<h2 class="title" data-anim="fadeinup">{{heading}}</h2>{{/heading}}
    <div class="timeline bracciale">
      <div class="rail" aria-hidden="true"></div>
      {{#items}}
      <div class="t-row" data-anim="fadeinup">
        <div class="t-dot" aria-hidden="true"><i></i></div>
        <div class="t-cell"><div class="t-time">{{time}}</div><div class="t-name">{{label}}</div></div>
      </div>
      {{/items}}
      <div class="br-chiusura" aria-hidden="true"></div>
    </div>
  </div>
</section>
{{/hasItems}}
