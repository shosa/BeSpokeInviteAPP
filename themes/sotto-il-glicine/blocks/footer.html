<section class="footer-sec glicine-sec">
  <div class="ft-trave" aria-hidden="true"><img src="assets/glicine3.webp" alt=""><img src="assets/glicine2.webp" alt=""><img src="assets/glicine1.webp" alt=""><img src="assets/glicine3.webp" alt=""><img src="assets/glicine2.webp" alt=""></div>
  <div class="footer-in">
    <h2 class="title" data-anim="fadein" style="--d:.15s">{{t.footerTitle}}</h2>
    {{#signature}}<div class="signature" data-anim="fadein" style="--d:.3s">{{signature}}</div>{{/signature}}
    <img class="ft-sigillo" src="assets/sigillo.webp" alt="" aria-hidden="true" data-anim="fadein" style="--d:.45s">
  </div>
  {{#venue}}<div class="credits">{{venue}}{{#address}} · {{address}}{{/address}}</div>{{/venue}}
</section>
