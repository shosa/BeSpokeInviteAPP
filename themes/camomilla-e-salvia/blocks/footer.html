<section class="footer-sec prato-sec">

    {{#signature}}<div class="signature" data-anim="fadein" style="--d:.3s">{{signature}}</div>{{/signature}}

  {{#venue}}<div class="credits">{{venue}}{{#address}} · {{address}}{{/address}}</div>{{/venue}}
  <div class="prato" aria-hidden="true"><img src="assets/rametto.webp" alt=""><img src="assets/salvia.webp" alt=""><img src="assets/rametto.webp" alt=""><img src="assets/rametto.webp" alt=""><img src="assets/salvia.webp" alt=""><img src="assets/rametto.webp" alt=""></div>
</section>
