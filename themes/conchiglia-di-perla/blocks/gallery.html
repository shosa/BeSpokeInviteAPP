{{#hasPhotos}}
<section class="sec us-sec collage-sec">
  <div class="card">
    {{#heading}}<h2 class="title" data-anim="fadeinup">{{heading}}</h2>{{/heading}}
    <div class="us-grid">
      {{#photos}}<figure class="stampa" data-anim="fadeinup"><span class="stampa-in"><img src="{{.}}" loading="lazy" decoding="async" alt=""></span></figure>{{/photos}}
    </div>
  </div>
</section>
{{/hasPhotos}}
