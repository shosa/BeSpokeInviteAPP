<section class="sec countdown-sec etichette-sec">
  <div class="card">
    <p class="et-intro" data-anim="fadein">{{t.countdownAria}}</p>
    <div class="et-filo" aria-hidden="true"></div>
    <div class="et-row" data-countdown="{{eventDate}}T{{eventTime}}" aria-label="{{t.countdownAria}}">
      <div class="time-block et" data-cd-block="days"><span class="et-foro" aria-hidden="true"></span><div class="number-wrap"><span class="number" data-cd="days">00</span></div><div class="label">{{t.days}}</div></div>
      <div class="separator sep1" aria-hidden="true"></div>
      <div class="time-block et" data-cd-block="hours"><span class="et-foro" aria-hidden="true"></span><div class="number-wrap"><span class="number" data-cd="hours">00</span></div><div class="label">{{t.hours}}</div></div>
      <div class="separator sep2" aria-hidden="true"></div>
      <div class="time-block et" data-cd-block="minutes"><span class="et-foro" aria-hidden="true"></span><div class="number-wrap"><span class="number" data-cd="minutes">00</span></div><div class="label">{{t.minutes}}</div></div>
      <div class="separator sep3" aria-hidden="true"></div>
      <div class="time-block et" data-cd-block="seconds"><span class="et-foro" aria-hidden="true"></span><div class="number-wrap"><span class="number" data-cd="seconds">00</span></div><div class="label">{{t.seconds}}</div></div>
    </div>
  </div>
</section>
