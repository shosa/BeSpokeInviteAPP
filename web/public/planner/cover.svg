<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 832" preserveAspectRatio="xMidYMid slice">
  <!-- Copertina d'esempio del planner: giardino al tramonto con luci appese e tavolate, disegno nostro. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d8a5f"/>
      <stop offset="0.35" stop-color="#5d6440"/>
      <stop offset="0.7" stop-color="#3b3a2b"/>
      <stop offset="1" stop-color="#241f1b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#e8cf98" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#e8cf98" stop-opacity="0"/>
